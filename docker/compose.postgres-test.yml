name: yava-postgres-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yava_test
      POSTGRES_USER: yava_test
      POSTGRES_PASSWORD: yava_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yava_test -d yava_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
