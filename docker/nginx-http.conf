# Loaded by nginx.conf inside the http context before the server definition.
# Do not log query strings or referrers: they can carry locations, searches,
# invitation codes, or other user-controlled sensitive values.
map $request_uri $yava_log_path {
    ~^/api/v1/invitations/[^/?]+/accept(?:\?|$) /api/v1/invitations/<redacted>/accept;
    ~^(?<path_without_query>[^?]*) $path_without_query;
    default /invalid-request;
}

log_format yava '$remote_addr - [$time_local] '
                '"$request_method $yava_log_path $server_protocol" '
                '$status $body_bytes_sent $request_time "$http_user_agent"';
