services:
  - type: web
    name: yava-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # Prefer an explicit pre-deploy operation. Enabling this only runs normal
      # Laravel schema migrations; Stage 1 data conversion is never run at boot.
      - key: RUN_SCHEMA_MIGRATIONS
        value: false
      - key: RUN_DEMO_SEEDER
        value: false
      - key: RUN_DEMO1_RICH_SEEDER
        value: false
      - key: DEMO_SEEDER_CLASS
        value: CurrentVersionDemoSeeder
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: AUTH_EMIT_LEGACY_TOKEN
        value: false
      - key: TRUSTED_PROXIES
        sync: false
      - key: OTP_PROVIDER
        value: unconfigured
      - key: PERENUAL_API_KEY
        sync: false
