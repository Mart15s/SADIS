services:
  - type: web
    name: sad-system-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: DB_CONNECTION
        value: pgsql
      - key: RUN_MIGRATIONS
        sync: false
      - key: RUN_DEMO_SEEDER
        sync: false
      - key: RUN_DEMO1_RICH_SEEDER
        value: false
      - key: DEMO_SEEDER_CLASS
        value: CurrentVersionDemoSeeder
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sad-system-db
          property: connectionString
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_SUPPORTS_CREDENTIALS
        value: false
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: TRUSTED_PROXIES
        value: '*'
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
      - key: PERENUAL_API_KEY
        sync: false

databases:
  - name: sad-system-db
    plan: free
    region: frankfurt
    databaseName: sad_system
    user: sad_system
    postgresMajorVersion: '18'
    ipAllowList: []
